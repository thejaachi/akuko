name: Plugin CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'akuko-mobile-api/**'
      - '.github/workflows/plugin-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'akuko-mobile-api/**'
      - '.github/workflows/plugin-ci.yml'

defaults:
  run:
    working-directory: akuko-mobile-api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: composer test
